name: Supabase Keep Alive

# Supabase 무료 프로젝트는 일정 기간 활동이 없으면 일시 중지된다.
# 3일마다 projects 테이블을 조회해 "활동"을 만들어 중지를 막는다.
# (같은 Supabase 프로젝트를 쓰는 Novel Story, TrackFit 도 함께 보호된다)
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 시크릿이 설정되어 있지 않습니다."
            exit 1
          fi

          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1")

          echo "HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "::error::Supabase 응답이 정상이 아닙니다 (HTTP $status). 프로젝트가 일시 중지되었을 수 있습니다."
            exit 1
          fi

          echo "Supabase 조회 성공"
